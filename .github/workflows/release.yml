name: Paczka wydania

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Zbuduj ZIP integracji z kartą mapy
        run: python tools/build_release.py --tag "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - name: Dołącz paczkę do istniejącego wydania
        run: gh release upload "$RELEASE_TAG" dist/gdzie_sie_ukryc.zip --repo "$RELEASE_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
