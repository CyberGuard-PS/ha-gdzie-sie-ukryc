name: Testy kodu

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check custom_components tools tests
      - run: ruff format --check custom_components tools tests
      - run: python tools/check_repository.py
      - run: python -m pytest -q
        env:
          PYTHONPATH: .

  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node --check custom_components/gdzie_sie_ukryc/frontend/gdzie-sie-ukryc-card.js
      - run: npm run test:card
